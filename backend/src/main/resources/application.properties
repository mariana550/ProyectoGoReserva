spring.application.name=goreserva
server.port=8080

# Base de datos: primero ejecuten database/goreserva_schema.sql en MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/goreserva?serverTimezone=America/Bogota
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# JWT: en producción cambien el secreto (mínimo 32 caracteres)
app.jwt.secret=${JWT_SECRET:goreserva-clave-secreta-de-desarrollo-2026-cambiar}
app.jwt.expiracion-horas=8
app.cors.origen=http://localhost:4200

# Administrador inicial (HU-08)
app.admin.correo=admin@goreserva.com
app.admin.password=Admin123*
